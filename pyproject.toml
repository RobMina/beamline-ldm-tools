[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamline-ldm-tools"
version = "0.2.0"
description = "Light-dark-matter tools for Geant4 beamline simulations (g4numi, g4lbnf): a portable Geant4 meson tally, meson lists for BdNMC with source-region splits, absorber proton yields, and the g4numi vs MIPP pion-yield comparison"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy", "uproot", "awkward", "matplotlib"]

[project.optional-dependencies]
pdf = ["pymupdf"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["beamline_ldm*", "g4numi_ldm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
